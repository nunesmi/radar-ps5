name: Radar PS5

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:          # botão "Run workflow" para rodar na hora
    inputs:
      teste_telegram:
        description: "Só enviar uma mensagem de teste no Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes rápidos
        run: python -m unittest discover -s tests

      - name: Teste do Telegram
        if: ${{ inputs.teste_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py --test-telegram

      - name: Verificar ofertas
        if: ${{ !inputs.teste_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py

      - name: Salvar histórico e painel
        if: ${{ !inputs.teste_telegram }}
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "sem mudanças"
          else
            git commit -m "radar: verificação $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep 5
            done
          fi
